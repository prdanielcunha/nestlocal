<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <meta name="description" content="NestLocal organiza pedidos, orçamentos e agenda de prestadores locais.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/live.css">
  <link rel="stylesheet" href="/launch.css">
  <link rel="stylesheet" href="/saas.css">
  <link rel="stylesheet" href="/premium.css">
  <link rel="stylesheet" href="/growth.css">
  <link rel="stylesheet" href="/operations.css">
  <title>NestLocal</title>
</head>
<body>
  <div class="noise"></div>
  <div id="app"></div>
  <script>
    (() => {
      const build = '20260929-render-fix-10';
      const launchUrl = () => {
        const target = new URL('https://www.millionsnest.com/apps/nestlocal/launch');
        const params = new URLSearchParams(location.search);
        const allowedViews = new Set(['today','requests','customers','agenda','services','automation','page','growth']);
        const view = params.get('view');
        target.searchParams.set('returnTo', view && allowedViews.has(view) ? '/?view=' + encodeURIComponent(view) : '/');
        return target.toString();
      };

      const bootParams = new URLSearchParams(location.search);
      const handoffExpectedAtBoot = bootParams.has('code') || bootParams.has('ecosystem_ctx');

      const recovery = (reason = '') => {
        const root = document.getElementById('app');
        if (!root) return;
        const text = (root.textContent || '').toLowerCase();
        const stuck = !text.trim() || text.includes('conectando sua conta') || text.includes('carregando');
        if (!stuck) return;

        const currentParams = new URLSearchParams(location.search);
        const handoffExpected =
          window.__nestLocalHandoffExpectedAtBoot === true ||
          currentParams.has('code') ||
          currentParams.has('ecosystem_ctx');

        if (!handoffExpected && !window.__nestLocalHandoffConsumed) {
          location.replace(launchUrl());
          return;
        }

        const stage = String(window.__nestLocalAuthStage || reason || 'bootstrap').replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
        root.innerHTML =
          '<main class="login-shell"><section class="login-card auth-recovery">' +
          '<div class="brand"><span class="brandmark">N</span>NestLocal</div>' +
          '<span class="eyebrow">NestLocal</span>' +
          '<h1>Não foi possível concluir a entrada</h1>' +
          '<p>O acesso chegou ao NestLocal, mas a abertura parou antes de concluir. Tente novamente nesta tela.</p>' +
          '<small class="login-trust">Etapa: ' + (stage || 'bootstrap') + ' · ' + build + '</small>' +
          '<div class="recovery-actions"><button class="button primary login-button" id="boot-retry">Tentar novamente</button>' +
          '<a class="button login-button" href="https://www.millionsnest.com">Abrir MillionsNest</a></div>' +
          '</section></main>';
        document.getElementById('boot-retry')?.addEventListener('click', () => location.reload());
      };

      window.__nestLocalBuild = build;
      window.__nestLocalHubLaunch = launchUrl;
      window.__nestLocalHandoffExpectedAtBoot = handoffExpectedAtBoot;
      window.__nestLocalHandoffConsumed = false;
      window.__nestLocalAuthStage = 'html_boot';
      window.__nestLocalRecover = recovery;
      window.__nestLocalBootGuard = setTimeout(() => recovery('html_timeout'), 20000);

      window.addEventListener('error', event => {
        window.__nestLocalAuthStage = window.__nestLocalAuthStage || 'window_error';
        setTimeout(() => recovery('window_error'), 0);
      });
      window.addEventListener('unhandledrejection', () => {
        window.__nestLocalAuthStage = window.__nestLocalAuthStage || 'unhandled_rejection';
        setTimeout(() => recovery('unhandled_rejection'), 0);
      });
    })();
  </script>
  <script type="module" src="/live.js?v=20260929-render-fix-10"></script>
</body>
</html>
