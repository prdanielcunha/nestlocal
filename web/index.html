<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <meta name="description" content="NestLocal organiza pedidos, orçamentos e agenda de prestadores locais.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/live.css">
  <link rel="stylesheet" href="/launch.css">
  <link rel="stylesheet" href="/saas.css">
  <link rel="stylesheet" href="/premium.css">
  <link rel="stylesheet" href="/growth.css">
  <link rel="stylesheet" href="/operations.css">
  <title>NestLocal</title>
</head>
<body>
  <div class="noise"></div>
  <div id="app"></div>
  <script>
    (() => {
      const build = '20260928-canonical-sso-4';
      const launchUrl = () => {
        const target = new URL('https://www.millionsnest.com/apps/nestlocal/launch');
        const params = new URLSearchParams(location.search);
        const allowedViews = new Set(['today','requests','customers','agenda','services','automation','page','growth']);
        const view = params.get('view');
        target.searchParams.set('returnTo', view && allowedViews.has(view) ? '/?view=' + encodeURIComponent(view) : '/');
        return target.toString();
      };
      const recovery = () => {
        const root = document.getElementById('app');
        if (!root) return;
        const text = (root.textContent || '').toLowerCase();
        const stuck = !text.trim() || text.includes('conectando sua conta') || text.includes('carregando');
        if (!stuck) return;
        const handoffExpected = new URLSearchParams(location.search).has('ecosystem_ctx');
        if (!handoffExpected) {
          location.replace(launchUrl());
          return;
        }
        root.innerHTML = '<main class="login-shell"><section class="login-card auth-recovery"><div class="brand"><span class="brandmark">N</span>NestLocal</div><span class="eyebrow">NestLocal</span><h1>Não foi possível concluir a entrada</h1><p>Vamos renovar sua sessão usando a mesma conta do MillionsNest.</p><div class="recovery-actions"><button class="button primary login-button" id="boot-retry">Tentar novamente</button><a class="button login-button" href="https://www.millionsnest.com">Abrir MillionsNest</a></div></section></main>';
        document.getElementById('boot-retry')?.addEventListener('click', () => location.replace(launchUrl()));
      };
      window.__nestLocalBuild = build;
      window.__nestLocalHubLaunch = launchUrl;
      window.__nestLocalBootGuard = setTimeout(recovery, 10000);
      window.addEventListener('error', () => setTimeout(recovery, 0));
      window.addEventListener('unhandledrejection', () => setTimeout(recovery, 0));
    })();
  </script>
  <script type="module" src="/live.js?v=20260928-canonical-sso-4"></script>
</body>
</html>
