name: Verify MillionsNest deploy access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-firebase-access.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify scoped access
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe millionsnest --format='value(projectId)'
          npx --yes firebase-tools@15.26.0 hosting:sites:list --project millionsnest
