name: Firestore API integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: firestore-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prepare-media-assets.mjs
      - name: Install browser for the real API user journey
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise actual API and Firestore transactions without cloud credentials
        env:
          FIREBASE_PROJECT_ID: demo-nestlocal-integration
          NESTLOCAL_BROWSER_INTEGRATION: 'true'
        run: npx --yes firebase-tools@15.26.0 emulators:exec --only firestore --project demo-nestlocal-integration --config firebase.emulators.json 'node scripts/integration-emulator.mjs'
      - name: Archive synthetic profile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nestlocal-operational-profiles
          path: artifacts/profiles/
          if-no-files-found: warn
          retention-days: 10
