name: Deploy NestLocal Hosting

on:
  push:
    branches: [production]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestlocal-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.26.0
      - name: Ensure isolated Hosting site
        run: |
          set -euo pipefail
          if ! firebase hosting:sites:list --project millionsnest | grep -q 'mn-nestlocal-555464791734'; then
            firebase hosting:sites:create mn-nestlocal-555464791734 --project millionsnest
          fi
          firebase target:apply hosting nestlocal mn-nestlocal-555464791734 --project millionsnest
      - name: Validate public bundle
        run: |
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          grep -q 'NestLocal' web/index.html
      - name: Deploy NestLocal only
        run: firebase deploy --only hosting:nestlocal --project millionsnest --non-interactive
