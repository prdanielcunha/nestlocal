name: Deploy NestLocal Hosting

on:
  push:
    branches: [production]
    paths:
      - "web/**"
      - "server.mjs"
      - "src/domain/**"
      - "package*.json"
      - "Dockerfile"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestlocal-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Detect API changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          api_changed=true
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
              git fetch --no-tags --depth=1 origin "$BEFORE"
              if git diff --name-only "$BEFORE" "${{ github.sha }}" --                 server.mjs src/domain package.json package-lock.json Dockerfile .dockerignore                 | grep -q .; then
                api_changed=true
              else
                api_changed=false
              fi
            fi
          fi
          echo "api_changed=$api_changed" >> "$GITHUB_OUTPUT"
          echo "API changed: $api_changed"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.26.0
      - name: Configure Artifact Registry
        if: steps.changes.outputs.api_changed == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build and push API
        if: steps.changes.outputs.api_changed == 'true'
        env:
          IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/nestlocal-api:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy API
        if: steps.changes.outputs.api_changed == 'true'
        env:
          IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/nestlocal-api:${{ github.sha }}
        run: |
          gcloud run deploy nestlocal-api \
            --project millionsnest \
            --region us-central1 \
            --image "$IMAGE" \
            --service-account mn-hub-runtime@millionsnest.iam.gserviceaccount.com \
            --port 8080 \
            --cpu 1 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --timeout 30 \
            --set-env-vars FIREBASE_PROJECT_ID=millionsnest,NODE_ENV=production \
            --allow-unauthenticated \
            --quiet
      - name: Ensure isolated Hosting sites
        run: |
          set -euo pipefail
          firebase hosting:sites:create nestlocal --project millionsnest || true
          firebase hosting:sites:create mn-nestlocal-555464791734 --project millionsnest || true
          firebase target:apply hosting nestlocal mn-nestlocal-555464791734 --project millionsnest
          firebase target:apply hosting nestlocal-alias nestlocal --project millionsnest
      - name: Authorize NestLocal login domains
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          CONFIG="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            https://identitytoolkit.googleapis.com/admin/v2/projects/millionsnest/config)"
          DOMAINS="$(jq -c '.authorizedDomains + ["nestlocal.web.app", "mn-nestlocal-555464791734.web.app", "nestlocal.millionsnest.com"] | unique' <<<"$CONFIG")"
          jq -n --argjson domains "$DOMAINS" '{authorizedDomains:$domains}' > /tmp/nestlocal-auth.json
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/nestlocal-auth.json \
            'https://identitytoolkit.googleapis.com/admin/v2/projects/millionsnest/config?updateMask=authorizedDomains' >/dev/null
      - name: Connect official custom domain
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE='https://firebasehosting.googleapis.com/v1beta1/projects/millionsnest/sites/mn-nestlocal-555464791734/customDomains'
          if ! curl --fail --silent -H "Authorization: Bearer $TOKEN" "$BASE/nestlocal.millionsnest.com" >/dev/null; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$BASE?customDomainId=nestlocal.millionsnest.com" >/dev/null
          fi
      - name: Validate public bundle
        run: |
          test -s web/index.html
          test -s web/live.js
          test -s web/live.css
          test -s web/styles.css
          grep -q 'NestLocal' web/index.html
          curl --fail --retry 5 --retry-delay 2 "$(gcloud run services describe nestlocal-api --project millionsnest --region us-central1 --format='value(status.url)')/health"
      - name: Deploy NestLocal only
        run: firebase deploy --only hosting:nestlocal,hosting:nestlocal-alias --project millionsnest --non-interactive
      - name: Smoke production endpoints
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "$1"
          }
          fetch_until_contains() {
            local url="$1" file="$2"
            shift 2
            for attempt in $(seq 1 10); do
              local separator='?'
              [[ "$url" == *'?'* ]] && separator='&'
              if fetch "${url}${separator}smoke=${GITHUB_SHA}-${attempt}" > "$file"; then
                local ready=1
                for pattern in "$@"; do
                  if ! grep -qF "$pattern" "$file"; then
                    ready=0
                    break
                  fi
                done
                if [[ "$ready" -eq 1 ]]; then
                  return 0
                fi
              fi
              echo "Waiting for deployed content at $url (attempt $attempt/10)" >&2
              sleep 3
            done
            echo "Expected deployed content did not propagate at $url" >&2
            return 1
          }

          fetch https://nestlocal.millionsnest.com/api/health > /tmp/nestlocal-health.json
          jq -e '.ok == true and .service == "nestlocal-api"' /tmp/nestlocal-health.json >/dev/null

          fetch_until_contains https://nestlocal.millionsnest.com/ /tmp/nestlocal-home.html 'id="app"' '/live.js'
          fetch_until_contains https://nestlocal.millionsnest.com/raio-x /tmp/nestlocal-xray.html 'id="app"'

          fetch_until_contains https://nestlocal.millionsnest.com/live.js /tmp/nestlocal-live.js \
            'revenueXrayView' 'growthFunnelView' 'parseGrowthBatch' 'nextBestActions' \
            'outcomeLearningCard' 'explainableInsights' 'data-start-experiment' \
            'data-experiment-id' 'experimentReview' 'data-review-context' 'operationalMemory' 'experimentContextHtml' 'learningLibrary' 'S.data.decisionMemory' 'canonicalAuthDomain' 'signInWithPopup' 'sessionFailure' 'newRequestForm' 'quotePanel' 'schedulePanel' 'operationPanel' 'function customers()' 'data-tracking-link' 'publishReadiness' 'action-resume-date' 'data-decision="accepted"'

          fetch_until_contains https://nestlocal.millionsnest.com/guided-experiment.js /tmp/nestlocal-guided-experiment.js \
            'renderGuidedExperiment' 'experimentForAction' 'decisionMemoryLibrary' 'experimentContextForAction' 'renderExperimentContext' 'buildExperimentReviewModel' 'guidedExperimentState' 'decisionMemoryLibrary' 'renderDecisionMemoryLibrary'

          fetch_until_contains https://nestlocal.millionsnest.com/growth.css /tmp/nestlocal-growth.css \
            '.xray-shell' '.growth-funnel'

          fetch_until_contains https://nestlocal.millionsnest.com/operations.css /tmp/nestlocal-operations.css \
            '.lifecycle-form' '.next-action' '.learning-metrics' '.learning-insight-status' \
            '.guided-experiment' '.assist-experiment' '.experiment-review' '.experiment-review-spread' '.assist-context' '.assist-context-spread' '.decision-memory-library' '.decision-memory-row' '.request-stage' '.customer-card' '.agenda-item' '.readiness-card'

          fetch_until_contains https://nestlocal.millionsnest.com/premium.css /tmp/nestlocal-premium.css \
            '.auth-recovery' '.auth-progress' '.recovery-actions'

          fetch_until_contains https://nestlocal.web.app/live.js /tmp/nestlocal-alias-live.js \
            'revenueXrayView' 'nextBestActions' 'outcomeLearningCard' 'explainableInsights' \
            'data-start-experiment' 'canonicalAuthDomain' 'signInWithPopup' 'sessionFailure' 'newRequestForm' 'quotePanel' 'function customers()' 'action-resume-date'

          fetch_until_contains https://nestlocal.web.app/guided-experiment.js /tmp/nestlocal-alias-guided-experiment.js \
            'renderGuidedExperiment' 'experimentForAction'
